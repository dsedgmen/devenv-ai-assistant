# Dependabot configuration for automated dependency updates

version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"

  # Docker containers
  - package-ecosystem: "docker"
    directory: "/containers/lsp-servers"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "containers"
    commit-message:
      prefix: "docker"

  - package-ecosystem: "docker"
    directory: "/containers/vim"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "containers"
    commit-message:
      prefix: "docker"

  - package-ecosystem: "docker"
    directory: "/containers/neovim"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "containers"
    commit-message:
      prefix: "docker"
