name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint Scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: find . -name "*.sh" -type f -print0 | xargs -0 -r shellcheck

  test-installation:
    name: Test Installation Scripts
    runs-on: ubuntu-24.04
    container: fedora:latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          bash -n install.sh
          bash -n devenv-ai-setup.sh

  test-configs:
    name: Test Configurations
    runs-on: ubuntu-24.04
    container: fedora:latest
    steps:
      - uses: actions/checkout@v5
      - run: dnf install -y neovim vim-enhanced
      - name: Test nvim-init.lua loads
        run: nvim --headless -u nvim-init.lua -i NONE -c "quit"
      - name: Test vimrc syntax
        run: vim -Nu vimrc -e -s -c "quit"
