name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true

jobs:
  prepare-release:
    name: Prepare Release Assets
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create release tarball
        run: |
          VERSION="${{ github.event.release.tag_name || github.event.inputs.version }}"
          tar -czf vim-ai-assistant-${VERSION}.tar.gz \
            --exclude='.git' \
            --exclude='*.pyc' \
            --exclude='__pycache__' \
            --exclude='.github' \
            .

      - name: Create installation bundle
        run: |
          VERSION="${{ github.event.release.tag_name || github.event.inputs.version }}"
          mkdir -p release-bundle
          cp install.sh release-bundle/
          cp install-lsp-treesitter.sh release-bundle/
          cp install-vim-plugins.sh release-bundle/
          cp README.md release-bundle/
          cp vimrc release-bundle/
          cp -r .config release-bundle/
          cp -r .local release-bundle/
          tar -czf vim-ai-assistant-install-${VERSION}.tar.gz -C release-bundle .

      - name: Generate checksums
        run: |
          sha256sum *.tar.gz > checksums.txt

      - name: Upload release assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            *.tar.gz
            checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-containers:
    name: Publish Release Containers
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [lsp-servers, vim, neovim]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: |
          VERSION="${{ github.event.release.tag_name || github.event.inputs.version }}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "major=$(echo ${VERSION} | cut -d. -f1)" >> $GITHUB_OUTPUT
          echo "minor=$(echo ${VERSION} | cut -d. -f1,2)" >> $GITHUB_OUTPUT

      - name: Build and push with version tags
        uses: docker/build-push-action@v5
        with:
          context: ./containers/${{ matrix.image }}
          file: ./containers/${{ matrix.image }}/Containerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.image }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}/${{ matrix.image }}:${{ steps.version.outputs.major }}
            ghcr.io/${{ github.repository }}/${{ matrix.image }}:${{ steps.version.outputs.minor }}
            ghcr.io/${{ github.repository }}/${{ matrix.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-readme:
    name: Update Container Pull Instructions
    needs: publish-containers
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update container documentation
        run: |
          VERSION="${{ github.event.release.tag_name || github.event.inputs.version }}"
          cat >> RELEASE_NOTES.md << EOF
          ## Container Images

          Pull the latest release containers:

          \`\`\`bash
          # LSP Servers
          podman pull ghcr.io/${{ github.repository }}/lsp-servers:${VERSION}

          # Vim
          podman pull ghcr.io/${{ github.repository }}/vim:${VERSION}

          # Neovim
          podman pull ghcr.io/${{ github.repository }}/neovim:${VERSION}
          \`\`\`

          Or use \`:latest\` for the most recent stable version.
          EOF

      - name: Commit documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add RELEASE_NOTES.md
          git commit -m "docs: update release notes for ${{ github.event.release.tag_name || github.event.inputs.version }}" || true
          git push || true
