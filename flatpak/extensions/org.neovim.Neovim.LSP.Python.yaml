# Flatpak Extension: Python LSP Server
# Install with: flatpak install org.neovim.Neovim.LSP.Python

id: org.neovim.Neovim.LSP.Python
branch: stable
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
build-extension: true
separate-locales: false

build-options:
  prefix: /app/lsp/python

modules:
  - name: python-lsp-server
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=/app/lsp/python --no-deps .
      - pip3 install --prefix=/app/lsp/python jedi pylsp-mypy python-lsp-black
    sources:
      - type: archive
        url: https://files.pythonhosted.org/packages/source/p/python-lsp-server/python-lsp-server-1.7.4.tar.gz
        sha256: c84254485a4d9431b24ecefd59741d21c00165611bcf6037bd7d54d0ed06a197

  - name: ruff
    buildsystem: simple
    build-commands:
      - cargo install --path . --root /app/lsp/python
    sources:
      - type: archive
        url: https://github.com/astral-sh/ruff/archive/v0.1.6.tar.gz
        sha256: <PLACEHOLDER>
